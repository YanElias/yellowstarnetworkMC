# YellowStar Network - planned topology
# This file documents intended settings; it is not a Velocity/Paper config.

network:
  name: "YellowStar Network"
  edition: "Java"
  initial_game_version: "1.21.1"

proxy:
  software: "Velocity"
  enabled: false
  bind: "0.0.0.0:25565"

servers:
  lobby:
    software: "Paper"
    version: "1.21.1"
    enabled: true
    directory: "servers/lobby"
    memory: "512M-2G"
  bedwars:
    software: "Paper"
    version: "1.21.1"
    enabled: false
    directory: "servers/bedwars"
  survival:
    software: "Paper"
    version: "1.21.1"
    enabled: false
    directory: "servers/survival"
  minigames:
    software: "Paper"
    version: "1.21.1"
    enabled: false
    directory: "servers/minigames"
  original:
    software: "Paper"
    version: "1.21.1"
    enabled: false
    directory: "servers/original"

compatibility:
  java_1_8_9_clients: "test later with protocol plugins; may require a legacy backend"
  bedrock_clients: false
